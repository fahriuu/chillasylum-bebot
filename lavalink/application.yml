server:
  port: 2333
  address: 127.0.0.1  # Hanya localhost untuk keamanan

lavalink:
  server:
    password: "ChillAsylumBebot2026"
    sources:
      youtube: false  # Dihandle oleh youtube-plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 2000
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false  # Pakai plugin
    soundcloudSearchEnabled: true
    gc-warnings: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Client list — plugin tries in order, falls back if one fails
    # MUSIC & ANDROID_VR are best for audio playback
    # TV is a good fallback that rarely gets blocked
    # WEB is used for search/metadata only (playback blocked by YouTube)
    clients:
      - MUSIC
      - ANDROID_VR
      - TV
      - WEB
      - WEBEMBEDDED
    clientOptions:
      MUSIC:
        playback: true
        videoLoading: true
        searching: true
      ANDROID_VR:
        playback: true
        videoLoading: false
        searching: false
      TV:
        playback: true
        videoLoading: false
        searching: false
      WEB:
        playback: false
        videoLoading: true
        playlistLoading: true
        searching: true
      WEBEMBEDDED:
        playback: true
        videoLoading: true
        searching: false
    # YouTube OAuth — uncomment dan isi refreshToken jika IP VPS di-block YouTube
    # Cara mendapatkan refreshToken:
    # 1. Set enabled: true, skipInitialization: false
    # 2. Restart Lavalink, cek log untuk link device code
    # 3. Buka link di browser, login Google account
    # 4. Copy refreshToken dari log, paste di bawah
    # 5. Set skipInitialization: true
    oauth:
      enabled: false
      # skipInitialization: true
      # refreshToken: "YOUR_REFRESH_TOKEN_HERE"

logging:
  file:
    path: ./logs/
    max-history: 7
    max-size: 25MB

  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
